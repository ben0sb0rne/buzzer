<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzzer - Teacher</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="host">

<main id="setup">
  <h1>Classroom Buzzer</h1>
  <p class="sub">Create a room, then put the code and join address on the board.</p>
  <button id="createBtn">Create room</button>
</main>

<main id="dash" hidden>
  <div class="bar">
    <div class="roomcode" id="roomCode"></div>
    <div class="joinlink">Join at <a id="joinLink" href="#"></a></div>
    <button id="reset">Reset Buzzers</button>
    <button id="cog" aria-label="Settings" aria-expanded="false" title="Settings">&#9881;</button>
  </div>

  <div id="panel" class="panel" hidden>
    <label class="opt"><input type="checkbox" id="mute"> Mute buzzer on this device</label>
    <button id="endGame">End game</button>
    <span class="note">Ending the game clears every team and frees student devices to join a new room. Remove one team with the &times; beside its row.</span>
  </div>

  <table>
    <thead>
      <tr>
        <th class="num">#</th>
        <th class="name">Team</th>
        <th class="members">Members</th>
        <th class="answer">Answer</th>
        <th class="rm"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="empty" id="empty">Waiting for teams to join...</p>
</main>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ";   // no I or O: they read as 1 and 0 on a projector
const MUTE_KEY = "buzzer-muted";

let teamsRef = null;
let buzzedIds = null;      // null until the first snapshot, so opening a live room does not beep
let muted = localStorage.getItem(MUTE_KEY) === "1";

$("#mute").checked = muted;
$("#createBtn").addEventListener("click", () => openRoom(newCode()));
$("#reset").addEventListener("click", resetBuzzers);
$("#cog").addEventListener("click", togglePanel);
$("#mute").addEventListener("change", setMute);
$("#endGame").addEventListener("click", armEndGame);

const fromUrl = (new URL(location).searchParams.get("room") || "")
  .toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
if (/^[A-Z]{4}$/.test(fromUrl)) openRoom(fromUrl);

function newCode() {
  let code = "";
  for (let i = 0; i < 4; i++) code += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
  return code;
}

function openRoom(code) {
  try { history.replaceState(null, "", "?room=" + code); } catch (e) {}  // a refresh keeps the room

  // Show the bare folder address: the directory index serves index.html anyway, and a
  // constant address is short enough to type off the board and to bookmark between lessons.
  const link = new URL("./", location.href);
  const shown = link.href.replace(/^https?:\/\//, "").replace(/\/$/, "");
  link.search = "?room=" + code;
  $("#roomCode").textContent = code;
  $("#joinLink").textContent = shown;
  $("#joinLink").href = link.href;   // the href still carries the room, so a copied link auto-fills
  $("#setup").hidden = true;
  $("#dash").hidden = false;

  teamsRef = db.ref("rooms/" + code + "/teams");
  teamsRef.on("value", render);
}

function render(snap) {
  const teams = [];
  snap.forEach((child) => {
    const t = child.val() || {};
    teams.push({
      id: child.key,
      name: t.name || "",
      members: t.members || "",
      answer: t.answer || "",
      buzzedAt: t.buzzedAt || 0
    });
  });

  teams.sort((a, b) =>
    (a.buzzedAt ? 0 : 1) - (b.buzzedAt ? 0 : 1) ||   // buzzed first
    a.buzzedAt - b.buzzedAt ||                       // then by server buzz time
    a.id.localeCompare(b.id)                         // stable tie-break
  );

  const nowBuzzed = teams.filter((t) => t.buzzedAt).map((t) => t.id);
  if (!muted && buzzedIds && nowBuzzed.some((id) => buzzedIds.indexOf(id) === -1)) beep();
  buzzedIds = nowBuzzed;

  const body = $("#rows");
  body.textContent = "";
  teams.forEach((t, i) => {
    const tr = body.insertRow();
    if (t.buzzedAt) tr.className = "buzzed";
    cell(tr, t.buzzedAt ? String(i + 1) : "", "num");
    cell(tr, t.name, "name", true);
    cell(tr, t.members, "members", true);
    cell(tr, t.buzzedAt ? t.answer : "", "answer");

    const td = tr.insertCell();
    td.className = "rm";
    const x = document.createElement("button");
    x.className = "rmbtn";
    x.textContent = "×";
    x.title = "Remove this team";
    x.setAttribute("aria-label", "Remove team");
    x.addEventListener("click", () => removeTeam(t.id));
    td.appendChild(x);
  });
  $("#empty").hidden = teams.length > 0;
}

function cell(tr, text, cls, clamp) {
  const td = tr.insertCell();
  td.className = cls;
  if (clamp) {
    // Inner box so one team's long member list cannot squeeze the answer column.
    const span = document.createElement("span");
    span.className = "clamp";
    span.textContent = text;   // typed by students: never innerHTML
    td.appendChild(span);
  } else {
    td.textContent = text;
  }
}

function resetBuzzers() {
  if (!teamsRef) return;
  teamsRef.once("value").then((snap) => {
    const updates = {};
    snap.forEach((child) => {
      updates[child.key + "/answer"] = "";
      updates[child.key + "/buzzedAt"] = null;
      updates[child.key + "/locked"] = false;
    });
    if (Object.keys(updates).length) return teamsRef.update(updates);
  }).catch((err) => { alert("Reset failed: " + err.message); });
}

function removeTeam(id) {
  if (!teamsRef) return;
  teamsRef.child(id).remove().catch((err) => { alert("Remove failed: " + err.message); });
}

function togglePanel() {
  const open = $("#panel").hidden;
  $("#panel").hidden = !open;
  $("#cog").setAttribute("aria-expanded", String(open));
  document.body.classList.toggle("editing", open);   // reveals the per-row remove buttons
}

function setMute() {
  muted = $("#mute").checked;
  localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
  if (!muted) beep();            // confirm it is audible again
}

// Two taps rather than a browser confirm box: this wipes the whole room.
let endArmed = false;
let endTimer = null;
function armEndGame() {
  const btn = $("#endGame");
  if (!endArmed) {
    endArmed = true;
    btn.textContent = "Tap again to end";
    btn.classList.add("danger");
    endTimer = setTimeout(disarmEndGame, 4000);
    return;
  }
  clearTimeout(endTimer);
  disarmEndGame();
  endGame();
}
function disarmEndGame() {
  endArmed = false;
  $("#endGame").textContent = "End game";
  $("#endGame").classList.remove("danger");
}

function endGame() {
  if (!teamsRef) return;
  const ref = teamsRef;
  ref.once("value").then((snap) => {
    const updates = {};
    snap.forEach((child) => { updates[child.key] = null; });
    if (Object.keys(updates).length) return ref.update(updates);
  }).then(() => {
    ref.off();
    teamsRef = null;
    buzzedIds = null;
    $("#rows").textContent = "";
    $("#panel").hidden = true;
    $("#cog").setAttribute("aria-expanded", "false");
    document.body.classList.remove("editing");
    $("#dash").hidden = true;
    $("#setup").hidden = false;
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }).catch((err) => { alert("Could not end the game: " + err.message); });
}
</script>
</body>
</html>
