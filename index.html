<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buzzer</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="student">

<main id="join" class="screen">
  <h1>Classroom Buzzer</h1>

  <div class="field">
    <label for="code">Room code</label>
    <input id="code" maxlength="4" autocapitalize="characters" autocomplete="off" spellcheck="false">
  </div>
  <div class="field">
    <label for="team">Team name</label>
    <input id="team" maxlength="40" autocomplete="off">
  </div>
  <div class="field">
    <label for="members">Team members (separate with commas)</label>
    <input id="members" maxlength="200" autocomplete="off" placeholder="Ada, Grace, Alan">
  </div>

  <p id="joinErr" class="err"></p>
  <button id="joinBtn">Join</button>
</main>

<main id="boot" class="screen" hidden>
  <p class="boot" id="bootMsg">Rejoining...</p>
</main>

<main id="play" class="screen" hidden>
  <div class="who">
    <span id="whoTeam"></span>
    <button id="leave" class="leave" title="Change room">
      <span id="leaveIdle">Room <b id="whoCode"></b></span>
      <span id="leaveArm" hidden>Tap again to leave</span>
    </button>
  </div>

  <div class="answerbox">
    <input id="answer" aria-label="Your answer" placeholder=" " autocomplete="off" enterkeyhint="done" maxlength="300">
    <div class="hint" aria-hidden="true">Type your answer</div>
  </div>

  <p id="playErr" class="err"></p>
  <button id="lock">Lock Answer</button>
</main>

<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.0.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const STORE = "buzzer-team";
const HOST_GONE = 60 * 60 * 1000;   // dashboard shut this long: the game is over
const OFFLINE = "Can't reach the server. Check Wi-Fi and try again.";
const urlCode = (new URL(location).searchParams.get("room") || "")
  .toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);

let teamRef = null;
let wasLocked = false;

const saved = loadSaved();
$("#code").value = urlCode || (saved ? saved.code : "");

// The link wins: a different room in the URL means a fresh join, not the remembered team.
if (saved && (!urlCode || urlCode === saved.code)) {
  show("boot");
  withTimeout(roomState(saved.code)).then((state) => {
    if (state === "over" || state === "none") {
      dropDeadRoom(saved.code, saved.teamId);
      show("join");
      return;
    }
    attach(saved.code, saved.teamId);
  }).catch(() => {
    // Not dropped and not sent to the join screen: a blip must not cost the team, and rejoining
    // there would make a second row. Say what is wrong, then let attach() land it if the
    // connection comes back - its listener fires on its own and swaps in the play screen.
    $("#bootMsg").textContent = OFFLINE;
    attach(saved.code, saved.teamId);
  });
} else {
  show("join");
}

$("#joinBtn").addEventListener("click", join);
$("#members").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
$("#leave").addEventListener("click", armLeave);
$("#lock").addEventListener("click", lockIn);
$("#answer").addEventListener("keydown", (e) => { if (e.key === "Enter") lockIn(); });

function show(which) {
  $("#boot").hidden = which !== "boot";
  $("#join").hidden = which !== "join";
  $("#play").hidden = which !== "play";
}

// The dashboard stamps rooms/<code>/hostSeen once a minute while it is open, so the stamp
// tells a live room from a dead one - and its absence tells both from a room that has never
// existed. "none" is that case: a mistyped code, which used to read as live and quietly got
// its own room. "unknown" is a read that failed, and that still counts as live, so a project
// whose rules predate hostSeen keeps working exactly as before: a device holding a team in a
// room that has since been emptied gets released by attach() instead.
function roomState(code) {
  return hostSeenAge(code)
    .then((age) => (age === null ? "none" : age > HOST_GONE ? "over" : "live"))
    .catch(() => "unknown");
}

// A Firebase read never times out; it waits for a connection. On a network that is not up yet,
// or one that blocks wss://, that leaves a student watching a dead screen with nothing to read
// and no way back. Ten seconds is long enough for slow school Wi-Fi and short enough to say so.
function withTimeout(p) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(OFFLINE)), 10000))]);
}

function dropDeadRoom(code, teamId) {
  remember(STORE, null);
  $("#code").value = urlCode || "";
  // The stale stamp stays put: it is the gravestone that tells every *other* device in the
  // class that the game is over. Clearing it would read as a live room to all of them.
  db.ref("rooms/" + code + "/teams/" + teamId).remove().catch(() => {});
}

// No expiry clock of its own, so there is only ever one answer to "is this game over": the
// hour in HOST_GONE, decided on the server's clock. A device keeps its team until it is told.
function loadSaved() {
  let raw = null;
  try { raw = JSON.parse(recall(STORE) || "null"); } catch (e) {}
  return raw && raw.code && raw.teamId ? raw : null;
}

function join() {
  // Enter in the members box calls this directly, so the disabled button is not a guard on
  // its own - and a held key repeats. Without this line one student makes a team per keypress.
  if ($("#joinBtn").disabled) return;
  const code = $("#code").value.trim().toUpperCase();
  const name = $("#team").value.trim();
  const members = $("#members").value.trim();
  if (!/^[A-Z]{4}$/.test(code)) { $("#joinErr").textContent = "Enter the 4-letter room code."; return; }
  if (!name) { $("#joinErr").textContent = "Enter a team name."; return; }

  $("#joinErr").textContent = "";
  $("#joinBtn").disabled = true;
  withTimeout(roomState(code)
    .then((state) => {
      if (state === "none") throw new Error("No game with that code. Check the letters on the board.");
      if (state === "over") throw new Error("That game has ended. Ask for the new code.");
      const ref = db.ref("rooms/" + code + "/teams").push();
      return ref.set({ name: name, members: members, answer: "", locked: false }).then(() => {
        remember(STORE, JSON.stringify({ code: code, teamId: ref.key }));
        attach(code, ref.key);
      });
    }))
    // Only on failure: a join that worked has already switched to the play screen, and
    // re-enabling the button there would let a still-held Enter make a second team.
    .catch((err) => { $("#joinErr").textContent = err.message; $("#joinBtn").disabled = false; });
}

function attach(code, teamId) {
  teamRef = db.ref("rooms/" + code + "/teams/" + teamId);
  teamRef.on("value", (snap) => {
    const team = snap.val();
    if (!team) {                       // team gone (teacher ended the game) - back to the join screen
      toJoinScreen();
      return;
    }
    $("#whoTeam").textContent = team.name;
    $("#whoCode").textContent = code;
    show("play");
    setLocked(!!team.locked, team.answer || "");
  });
}

// Two taps, so a stray touch on a locked answer screen cannot drop the team.
let leaveArmed = false;
let leaveTimer = null;
function armLeave() {
  if (!leaveArmed) {
    leaveArmed = true;
    $("#leaveIdle").hidden = true;
    $("#leaveArm").hidden = false;
    $("#leave").classList.add("arm");
    leaveTimer = setTimeout(disarmLeave, 4000);
    return;
  }
  clearTimeout(leaveTimer);
  disarmLeave();
  toJoinScreen();
}

function disarmLeave() {
  leaveArmed = false;
  $("#leaveIdle").hidden = false;
  $("#leaveArm").hidden = true;
  $("#leave").classList.remove("arm");
}

// Leaves the team in the database on purpose: the teacher keeps the row (and any locked
// answer) and can drop it with the x in the settings panel.
function toJoinScreen() {
  if (teamRef) { teamRef.off(); teamRef = null; }
  remember(STORE, null);
  wasLocked = false;
  $("#answer").disabled = false;
  $("#answer").value = "";
  $("#lock").disabled = false;
  $("#lock").textContent = "Lock Answer";
  $("#playErr").textContent = "";
  $("#code").value = "";
  show("join");
}

function setLocked(locked, answer) {
  const box = $("#answer");
  const btn = $("#lock");
  if (locked) {
    box.value = answer;
  } else if (wasLocked) {
    box.value = "";                    // only on release, so live typing is never wiped
    $("#playErr").textContent = "";
  }
  wasLocked = locked;
  box.disabled = locked;
  btn.disabled = locked;
  btn.textContent = locked ? "Locked in" : "Lock Answer";
}

function lockIn() {
  if (!teamRef || $("#lock").disabled) return;
  const answer = $("#answer").value.trim();
  if (!answer) return;                 // empty box does nothing
  // Every write stamps a fresh buzzedAt, and the snapshot that disables this button is a round
  // trip away. A second tap inside that gap would re-stamp the team and lose a race it had
  // won, so shut the button now; setLocked takes it from here when the snapshot lands.
  $("#lock").disabled = true;
  beep();
  teamRef.update({ answer: answer, buzzedAt: SERVER_TIME, locked: true })
    .catch((err) => { $("#playErr").textContent = err.message; $("#lock").disabled = false; });
}
</script>
</body>
</html>
